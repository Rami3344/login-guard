services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: loginguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d loginguard"]
      interval: 2s
      timeout: 3s
      retries: 15
    # no ports: -> reachable only from inside Docker's network

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://guard:${POSTGRES_PASSWORD}@db:5432/loginguard
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
